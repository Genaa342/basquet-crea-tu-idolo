<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE ROOKIE | Simón Dice</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mini-fit.css?v=8">
    <script src="js/mini-fit.js?v=5"></script>

    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Press Start 2P", system-ui, sans-serif;
            font-weight: 400;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #08090d;
            color: white;
            overflow-x: hidden;
        }


        /* =========================
           FONDO THE ROOKIE
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(8, 9, 13, 0.88),
                    rgba(8, 9, 13, 0.98)
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(255, 120, 20, 0.18),
                    transparent 35%
                );

            z-index: -2;
        }

        .background::after {
            content: "";

            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            opacity: 0.25;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            width: 100%;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid rgba(255,255,255,0.08);

            background: rgba(8,9,13,0.85);
            backdrop-filter: blur(12px);

            position: sticky;
            top: 0;

            z-index: 100;
        }

        .logo {
            display: flex;
            flex-direction: column;

            line-height: 0.8;
        }

        .logo span {
            font-size: 10px;
            letter-spacing: 4px;
            color: #aaa;
        }

        .logo strong {
            font-size: 25px;
            letter-spacing: 1px;
            color: #ff7518;
        }

        nav {
            display: flex;
            gap: 35px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;

            font-size: 10px;
            letter-spacing: 1px;

            transition: 0.3s;
        }

        nav a:hover {
            color: #ff7518;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 9px;
            color: #aaa;
        }

        .user-icon {
            width: 35px;
            height: 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #333;
            border-radius: 50%;

            font-size: 17px;
        }


        /* =========================
           CONTENEDOR PRINCIPAL
        ========================= */

        .game-wrapper {
            min-height: calc(100vh - 80px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 70px 7%;
        }

        .game {
            width: 100%;
            max-width: 850px;

            background: #0d0f14;

            border: 1px solid #272a33;

            padding: 55px;

            position: relative;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45);
        }

        .game::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background: #ff7518;
        }


        /* =========================
           ENCABEZADO
        ========================= */

        .game-header {
            text-align: center;

            margin-bottom: 35px;
        }

        .small-title {
            color: #ff7518;

            font-size: 10px;

            letter-spacing: 3px;

            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(30px, 5vw, 50px);

            line-height: 1.2;

            margin-bottom: 15px;
        }

        h1 span {
            color: #ff7518;
        }

        .subtitle {
            color: #777;

            font-size: 10px;

            line-height: 1.8;
        }


        /* =========================
           INFORMACIÓN
        ========================= */

        .info {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 25px;
        }

        .info-box {
            background: #14161d;

            border: 1px solid #272a33;

            padding: 18px 10px;

            text-align: center;

            transition: 0.3s;
        }

        .info-box:hover {
            border-color: #ff7518;
        }

        .info-box span {
            display: block;

            color: #666;

            font-size: 8px;

            margin-bottom: 10px;

            letter-spacing: 1px;
        }

        .info-box strong {
            font-size: 17px;

            color: white;
        }

        .info-box strong.highlight {
            color: #ff7518;
        }


        /* =========================
           MENSAJE
        ========================= */

        #message {
            min-height: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            color: #aaa;

            font-size: 10px;

            line-height: 1.7;

            margin-bottom: 20px;
        }


        /* =========================
           TABLERO
        ========================= */

        .board-container {
            background: #08090d;

            border: 1px solid #272a33;

            padding: 18px;

            position: relative;
        }

        .board {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }


        /* =========================
           CUADROS
        ========================= */

        .color-button {
            width: 100%;

            aspect-ratio: 1 / 1;

            border: 2px solid rgba(255,255,255,0.08);

            border-radius: 0;

            cursor: pointer;

            position: relative;

            transition:
                transform 0.1s,
                filter 0.1s,
                box-shadow 0.1s,
                border-color 0.1s;

            overflow: hidden;
        }

        .color-button::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.08),
                    transparent 50%
                );

            pointer-events: none;
        }

        .color-button:hover {
            transform: translateY(-2px);

            border-color: rgba(255,117,24,0.6);
        }

        .color-button:active {
            transform: scale(0.96);
        }


        /* =========================
           COLORES
        ========================= */

        .red {
            background: #9e3038;
        }

        .blue {
            background: #315c76;
        }

        .green {
            background: #28776d;
        }

        .yellow {
            background: #a98d35;
        }

        .purple {
            background: #69419a;
        }

        .orange {
            background: #a85f35;
        }

        .pink {
            background: #9c4d68;
        }

        .cyan {
            background: #187a91;
        }


        /* =========================
           EFECTO SIMÓN
        ========================= */

        .color-button.active {
            filter: brightness(2);

            border-color: white;

            box-shadow:
                0 0 20px rgba(255,255,255,0.7),
                0 0 50px rgba(255,117,24,0.4);

            transform: scale(0.94);

            z-index: 5;
        }


        /* =========================
           BOTÓN
        ========================= */

        #start-button {
            display: block;

            margin: 30px auto 0;

            padding: 17px 28px;

            border: none;

            border-radius: 0;

            background: #ff7518;

            color: white;

            font-family: "Press Start 2P", system-ui, sans-serif;

            font-size: 10px;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.3s;
        }

        #start-button:hover {
            background: #ff8d42;

            transform: translateY(-3px);

            box-shadow:
                0 8px 25px rgba(255,117,24,0.25);
        }

        #start-button:disabled {
            opacity: 0.45;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =========================
           PIE DEL JUEGO
        ========================= */

        .game-footer {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #22252d;
        }

        .game-footer span {
            color: #555;

            font-size: 8px;

            letter-spacing: 1px;
        }

        .game-footer strong {
            color: #ff7518;

            font-size: 8px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 45px 7%;

            border-top: 1px solid #222;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: #08090d;
        }

        footer p {
            color: #555;

            font-size: 9px;

            letter-spacing: 2px;
        }

        footer small {
            color: #444;

            font-size: 8px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            nav {
                display: none;
            }

            .game-wrapper {
                padding: 50px 5%;
            }

            .game {
                padding: 40px 30px;
            }

        }


        @media (max-width: 600px) {

            .navbar {
                padding: 0 5%;
            }

            .user span {
                display: none;
            }

            .game-wrapper {
                padding: 35px 15px;
            }

            .game {
                padding: 35px 18px;
            }

            .info {
                gap: 7px;
            }

            .info-box {
                padding: 15px 5px;
            }

            .info-box span {
                font-size: 6px;
            }

            .info-box strong {
                font-size: 12px;
            }

            .board-container {
                padding: 10px;
            }

            .board {
                gap: 6px;
            }

            .subtitle {
                font-size: 8px;
            }

            #message {
                font-size: 8px;
            }

            #start-button {
                font-size: 8px;

                padding: 15px 18px;
            }

            .game-footer {
                flex-direction: column;

                gap: 10px;
            }

            footer {
                flex-direction: column;

                gap: 20px;

                text-align: center;
            }

        }

    </style>
</head>

<body>

    <div class="background"></div>


    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="logo">
            <span>THE</span>
            <strong>ROOKIE</strong>
        </div>

        <nav>
            <a href="página_principal.html#inicio">INICIO</a>
            <a href="página_principal.html#carrera">CARRERA</a>
            <a href="página_principal.html#ranking">RANKING</a>
            <a href="página_principal.html#como-jugar">
                CÓMO JUGAR
            </a>
        </nav>

        <div class="user">

            <div class="user-icon">
                🏀
            </div>

            <span>INVITADO</span>

        </div>

    </header>


    <!-- =========================
         JUEGO
    ========================= -->

    <main class="game-wrapper">

        <div class="game">


            <!-- ENCABEZADO -->

            <div class="game-header">

                <p class="small-title">
                    DESAFÍO DE MEMORIA
                </p>

                <h1>
                    SIMÓN <span>DICE</span>
                </h1>

                <p class="subtitle">
                    MEMORIZÁ LA SECUENCIA Y REPETILA
                </p>

            </div>


            <!-- INFORMACIÓN -->

            <div class="info">

                <div class="info-box">

                    <span>RONDA</span>

                    <strong
                        id="round"
                        class="highlight">
                        1/7
                    </strong>

                </div>


                <div class="info-box">

                    <span>SECUENCIA</span>

                    <strong id="sequence-length">
                        1
                    </strong>

                </div>


                <div class="info-box">

                    <span>RÉCORD</span>

                    <strong
                        id="record"
                        class="highlight">
                        0
                    </strong>

                </div>

            </div>


            <!-- MENSAJE -->

            <p id="message">
                PRESIONÁ "COMENZAR"
            </p>


            <!-- TABLERO -->

            <div class="board-container">

                <div
                    id="board"
                    class="board">

                    <!--
                        Los 16 cuadros
                        se generan con JS
                    -->

                </div>

            </div>


            <!-- BOTÓN -->

            <button id="start-button">
                ▶ COMENZAR
            </button>


            <!-- INFORMACIÓN INFERIOR -->

            <div class="game-footer">

                <span>
                    16 CUADROS
                </span>

                <strong>
                    7 RONDAS
                </strong>

                <span>
                    CAMINO A LA LEYENDA
                </span>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="logo">

            <span>THE</span>

            <strong>ROOKIE</strong>

        </div>

        <p>
            CAMINO A LA LEYENDA
        </p>

        <small>
            DESAFÍO SIMÓN DICE
        </small>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const board =
            document.getElementById("board");

        const message =
            document.getElementById("message");

        const roundDisplay =
            document.getElementById("round");

        const sequenceLengthDisplay =
            document.getElementById("sequence-length");

        const recordDisplay =
            document.getElementById("record");

        const startButton =
            document.getElementById("start-button");


        /* =========================
           CONFIGURACIÓN
        ========================= */

        const colors = [

            "red",
            "blue",
            "green",
            "yellow",

            "purple",
            "orange",
            "pink",
            "cyan",

            "red",
            "blue",
            "green",
            "yellow",

            "purple",
            "orange",
            "pink",
            "cyan"

        ];


        /*
            7 rondas:

            3
            4
            5
            6
            6
            6
            6
        */

        const rounds = [

            3,
            4,
            5,
            6,
            6,
            6,
            6

        ];


        /* =========================
           VARIABLES
        ========================= */

        let buttons = [];

        let sequence = [];

        let playerSequence = [];

        let currentRound = 0;

        let playerTurn = false;

        let record = 0;


        /* =========================
           CREAR TABLERO
        ========================= */

        function createBoard() {

            board.innerHTML = "";

            buttons = [];


            colors.forEach(
                (color, index) => {

                    const button =
                        document.createElement("button");

                    button.classList.add(
                        "color-button",
                        color
                    );

                    button.dataset.index =
                        index;


                    button.addEventListener(
                        "click",
                        () => playerClick(index)
                    );


                    board.appendChild(button);

                    buttons.push(button);

                }
            );

        }


        /* =========================
           COMENZAR
        ========================= */

        function startGame() {
            if (window.rookieMarcar) rookieMarcar(true);

            currentRound = 0;

            sequence = [];

            playerSequence = [];

            playerTurn = false;

            startButton.disabled = true;

            startButton.textContent =
                "JUGANDO...";


            record = 0;

            recordDisplay.textContent =
                record;


            nextRound();

        }


        /* =========================
           SIGUIENTE RONDA
        ========================= */

        function nextRound() {

            playerTurn = false;

            playerSequence = [];


            currentRound++;


            if (
                currentRound >
                rounds.length
            ) {

                winGame();

                return;

            }


            const sequenceLength =
                rounds[
                    currentRound - 1
                ];


            sequence = [];


            for (
                let i = 0;
                i < sequenceLength;
                i++
            ) {

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        buttons.length
                    );


                sequence.push(
                    randomIndex
                );

            }


            roundDisplay.textContent =
                `${currentRound}/${rounds.length}`;


            sequenceLengthDisplay.textContent =
                sequenceLength;


            message.textContent =
                "👀 MIRÁ LA SECUENCIA";


            setTimeout(
                () => {

                    showSequence();

                },
                800
            );

        }


        /* =========================
           MOSTRAR SECUENCIA
        ========================= */

        async function showSequence() {

            playerTurn = false;


            for (
                let i = 0;
                i < sequence.length;
                i++
            ) {

                const index =
                    sequence[i];


                await sleep(500);


                buttons[index]
                    .classList
                    .add("active");


                await sleep(450);


                buttons[index]
                    .classList
                    .remove("active");

            }


            playerTurn = true;


            message.textContent =
                "🎯 REPETÍ LA SECUENCIA";

        }


        /* =========================
           CLICK DEL JUGADOR
        ========================= */

        function playerClick(index) {

            if (!playerTurn) {
                return;
            }


            buttons[index]
                .classList
                .add("active");


            setTimeout(
                () => {

                    buttons[index]
                        .classList
                        .remove("active");

                },
                150
            );


            playerSequence.push(index);


            const position =
                playerSequence.length - 1;


            if (
                playerSequence[position] !==
                sequence[position]
            ) {

                gameOver();

                return;

            }


            if (
                playerSequence.length ===
                sequence.length
            ) {

                playerTurn = false;


                if (
                    currentRound >
                    record
                ) {

                    record =
                        currentRound;

                    recordDisplay.textContent =
                        record;

                }


                message.textContent =
                    "✓ ¡CORRECTO!";


                setTimeout(
                    () => {

                        nextRound();

                    },
                    1000
                );

            }

        }


        /* =========================
           GAME OVER
        ========================= */

        function gameOver() {
            if (window.rookieSumar) rookieSumar("simon", false);
            if (window.rookieMarcar) rookieMarcar(false);
            playerTurn = false;


            message.textContent =
                `✕ TE EQUIVOCASTE. LLEGASTE A LA RONDA ${currentRound}.`;


            startButton.disabled = false;

            startButton.textContent =
                "↻ JUGAR DE NUEVO";

        }


        /* =========================
           GANAR
        ========================= */

        function winGame() {
            if (window.rookieSumar) rookieSumar("simon", true);
            if (window.rookieMarcar) rookieMarcar(false);
            playerTurn = false;


            message.textContent =
                "🏆 ¡GANASTE! COMPLETASTE LAS 8 RONDAS.";


            startButton.disabled = false;

            startButton.textContent =
                "↻ JUGAR DE NUEVO";


            record = 8;

            recordDisplay.textContent =
                record;

        }


        /* =========================
           ESPERAR
        ========================= */

        function sleep(milliseconds) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        milliseconds
                    )
            );

        }


        /* =========================
           BOTÓN
        ========================= */

        startButton.addEventListener(
            "click",
            startGame
        );


        /* =========================
           INICIAR
        ========================= */

        createBoard();

    </script>

</body>
</html>
</body>
</html>
